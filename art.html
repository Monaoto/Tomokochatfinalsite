<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Archive Menu</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }

    h1 {
      text-align: center;
      padding: 1.5rem 0;
      font-size: 2rem;
      color: #fff;
    }

    .section {
      padding: 1rem;
    }

    .section h2 {
      margin: 0.5rem 0;
      font-size: 1.4rem;
      border-bottom: 1px solid #555;
      display: inline-block;
      padding-bottom: 0.3rem;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr; /* une seule colonne verticale */
      gap: 0.8rem;
    }

    .movement {
      background: #111;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.7);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.3rem;
    }

    .movement:hover {
      transform: translateX(5px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.9);
    }

    .movement img {
      width: 100px;   /* taille intermédiaire */
      height: 150px;  /* hauteur intermédiaire */
      object-fit: cover;
      display: block;
      margin-right: 0.5rem;
      border-radius: 4px;
    }

    .caption {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

  <h1>Art Archive</h1>

  <!-- Peinture -->
  <div class="section" id="peinture">
    <h2>Peinture</h2>
    <div class="grid">
      <a href="peinture.html">
        <div class="movement">
          <img src="cabanel.jpg" alt="Jean-Michel Basquiat">
          <div class="caption">Jean-Michel Basquiat</div>
        </div>
      </a>
      <a href="bourgeois.html">
        <div class="movement">
          <img src="basquiat.webp" alt="Louise Bourgeois">
          <div class="caption">Louise Bourgeois</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Photographie -->
  <div class="section" id="photographie">
    <h2>Photographie</h2>
    <div class="grid">
      <a href="photo.html">
        <div class="movement">
          <img src="nan-goldin.jpg" alt="Nan Goldin">
          <div class="caption">Nan Goldin</div>
        </div>
      </a>
      <a href="tillmans.html">
        <div class="movement">
          <img src="bruce gilden.jpg" alt="Wolfgang Tillmans">
          <div class="caption">Wolfgang Tillmans</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Arts Performatifs -->
  <div class="section" id="arts-performatifs">
    <h2>Arts Performatifs</h2>
    <div class="grid">
      <a href="perf.html">
        <div class="movement">
          <img src="abramovic.jpg" alt="Marina Abramovic">
          <div class="caption">Marina Abramovic</div>
        </div>
      </a>
      <a href="stefan.html">
        <div class="movement">
          <img src="cassils.jpg" alt="Stef Van Looveren">
          <div class="caption">Stef Van Looveren</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Mode -->
  <div class="section" id="mode">
    <h2>Mode</h2>
    <div class="grid">
      <a href="mode.html">
        <div class="movement">
          <img src="ax-mcqueen.jpg" alt="Vivienne Westwood">
          <div class="caption">Vivienne Westwood</div>
        </div>
      </a>
      <a href="arca.html">
        <div class="movement">
          <img src="jean-paul-gaultier.jpg" alt="Arca">
          <div class="caption">Arca</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Livres d'art -->
  <div class="section" id="livres-dart">
    <h2>Livres d'Art</h2>
    <div class="grid">
      <a href="book.html">
        <div class="movement">
          <img src="sophie-calle.jpg" alt="Sophie Calle">
          <div class="caption">Sophie Calle</div>
        </div>
      </a>
      <a href="imhof.html">
        <div class="movement">
          <img src="anne-imhof.jpg" alt="Anne Imhof">
          <div class="caption">Anne Imhof</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Arts numériques -->
  <div class="section" id="arts-numeriques">
    <h2>Arts Numériques</h2>
    <div class="grid">
      <a href="numerique.html">
        <div class="movement">
          <img src="jon-rafman.jpg" alt="Jon Rafman">
          <div class="caption">Jon Rafman</div>
        </div>
      </a>
      <a href="stelarc.html">
        <div class="movement">
          <img src="stelarc.jpg" alt="Stelarc">
          <div class="caption">Stelarc</div>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
